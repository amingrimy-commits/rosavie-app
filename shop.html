<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rosa Vie | رُزاوی</title>
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:#111111;color:#eee;min-height:100vh}
.hdr{background:linear-gradient(135deg,#c4607a,#d4789a,#e8a0b0);padding:20px 16px;text-align:center}
.hdr h1{font-size:1.8rem;font-weight:900;letter-spacing:6px;color:#fff}
.hdr p{font-size:0.72rem;color:rgba(255,255,255,0.85);letter-spacing:4px;margin-top:3px}
.searchbar{max-width:960px;margin:16px auto 0;padding:0 14px}
.searchbar input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2a2a2a;background:#1a1a1a;color:#eee;font-family:inherit;font-size:0.86rem}
.searchbar input::placeholder{color:#777}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;max-width:960px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid #333;background:#1a1a1a;color:#ccc;font-size:0.74rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{border-color:#d4789a;background:#2a1a22;color:#f0a8c0}
.rescount{max-width:960px;margin:10px auto 0;padding:0 16px;font-size:0.72rem;color:#888}
.grid{max-width:960px;margin:10px auto 30px;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden;border:1px solid #2a2a2a;cursor:pointer;position:relative}
.card-img-ph{width:100%;aspect-ratio:1;background:#252525;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.cat-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#eee;font-size:0.6rem;padding:3px 8px;border-radius:8px}
.card-body{padding:10px 11px 12px}
.card-name{font-size:0.78rem;font-weight:700;color:#f0f0f0;line-height:1.4}
.card-brand{font-size:0.66rem;color:#999;margin-top:2px}
.card-code{font-size:0.66rem;color:#888;margin-top:2px}
.card-info{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card-tag{font-size:0.62rem;background:#252525;color:#bbb;padding:2px 7px;border-radius:6px}
.card-price{font-size:0.88rem;color:#e8a0b8;font-weight:900;margin-top:8px}
.badge-in,.badge-call,.badge-out{display:inline-block;margin-top:6px;font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:6px}
.badge-in{background:#12331f;color:#6fcf97}
.badge-call{background:#332912;color:#e0b060}
.badge-out{background:#331515;color:#e57373}
.nores{text-align:center;padding:60px 20px;color:#666;font-size:0.85rem;grid-column:1/-1}
.loading{text-align:center;padding:60px 20px;color:#888;font-size:0.85rem;grid-column:1/-1}
/* مودال جزئیات */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:3000;align-items:flex-end;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:#161616;border-radius:18px 18px 0 0;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:20px 18px}
@media(min-width:640px){.modal-ov{align-items:center}.modal{border-radius:16px}}
.modal-close{width:32px;height:32px;border-radius:50%;background:#1e1e1e;border:1px solid #333;color:#eee;font-size:1rem;float:left;cursor:pointer}
.modal-name{font-size:1.05rem;font-weight:900;color:#fff;margin-top:6px}
.modal-brand{font-size:0.75rem;color:#999;margin-top:2px}
.modal-price{font-size:1.2rem;color:#e8a0b8;font-weight:900;margin-top:12px}
.modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #2a2a2a;font-size:0.78rem}
.modal-row span:first-child{color:#999}
.modal-row span:last-child{color:#eee;font-weight:700}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.modal-actions a{text-align:center;padding:11px 6px;border-radius:10px;text-decoration:none;font-size:0.74rem;font-weight:700;background:#1e1e1e;border:1px solid #333;color:#eee}
.modal-actions a.act-main{background:#2a9d5c;border-color:#2a9d5c;color:#fff;grid-column:1/-1}
.footer-note{max-width:960px;margin:0 auto 30px;padding:0 16px;text-align:center;color:#666;font-size:0.7rem;line-height:1.9}
</style>
</head>
<body>
<div class="hdr"><h1>ROSA VIE</h1><p>under wear</p></div>
<div class="searchbar"><input id="SQ" type="text" placeholder="جستجوی کد، نام یا سایز محصول..." oninput="renderGrid()"></div>
<div class="chips" id="CHIPS"></div>
<div class="rescount" id="RC"></div>
<div class="grid" id="GRID"><div class="loading">در حال دریافت محصولات...</div></div>

<div class="modal-ov" id="MODAL_OV" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="MODAL_BODY"></div>
</div>

<div class="footer-note">برای ثبت سفارش، روی محصول بزن و از دکمه‌ی تماس با ما استفاده کن.</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyCNFSPZFDSCrhVloy-3yv0rUGcKIzSz50A",authDomain:"rosavie-app.firebaseapp.com",projectId:"rosavie-app",storageBucket:"rosavie-app.firebasestorage.app",messagingSenderId:"559569944295",appId:"1:559569944295:web:ffee7e8bd00ae61ed12c42"};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var CATS=[
  {v:'all',l:'همه'},{v:'p1',l:'سوتین و ست'},{v:'p2',l:'نیمتنه و ست'},{v:'p3',l:'شورت'},
  {v:'p4',l:'لباس خواب'},{v:'p5',l:'لوازم جانبی'},{v:'p6',l:'مایو'},{v:'p7',l:'کراپ'},
  {v:'p8',l:'تاپ'},{v:'p9',l:'بادی'}
];
var PRODUCTS=[];
var CUR_CAT='all';
var TEL_UNDERWEAR='https://t.me/rozavie_underwear';
var TEL_SLEEPWEAR='https://t.me/rozavie_sleepwear';
var BALE_LINK='https://ble.ir/rozavie_underwear';
var INSTAGRAM_LINK='https://www.instagram.com/rozavie_underwear';
var SUPPORT_TG='https://t.me/amin_beik_mohammady';
var PHONE_NUM='09190134599';

function fmtP(v){
  var n=parseInt(String(v).replace(/[^\d]/g,''),10);
  if(!n)return v||'--';
  return n.toLocaleString('en-US')+' تومان';
}

function renderChips(){
  var el=document.getElementById('CHIPS');
  el.innerHTML=CATS.map(function(c){
    return '<button class="chip'+(CUR_CAT===c.v?' on':'')+'" onclick="setCat(\''+c.v+'\')">'+c.l+'</button>';
  }).join('');
}
function setCat(v){CUR_CAT=v;renderChips();renderGrid();}

function renderGrid(){
  var q=(document.getElementById('SQ').value||'').trim().toLowerCase();
  var items=PRODUCTS.filter(function(p){
    var mc=CUR_CAT==='all'||p.tab===CUR_CAT;
    var mq=!q||[p.code,p.title,p.sizes,p.colors,p.brand].some(function(v){return (v||'').toLowerCase().indexOf(q)>-1;});
    return mc&&mq;
  });
  document.getElementById('RC').textContent=items.length+' محصول';
  var grid=document.getElementById('GRID');
  if(!items.length){grid.innerHTML='<div class="nores">محصولی یافت نشد</div>';return;}
  grid.innerHTML=items.map(function(p,i){
    var st=p.stock==='in'?'<span class="badge-in">موجود</span>':p.stock==='call'?'<span class="badge-call">تماس بگیرید</span>':'<span class="badge-out">ناموجود</span>';
    var nm=p.title||p.typeLabel||p.code;
    return '<div class="card" onclick="openModal('+i+')"><div class="card-img-ph">👗</div><span class="cat-badge">'+(p.tabLabel||'')+'</span>'+
      '<div class="card-body"><div class="card-name">'+nm+'</div>'+
      (p.brand?'<div class="card-brand">'+p.brand+'</div>':'')+
      (p.code?'<div class="card-code">کد: '+p.code+'</div>':'')+
      '<div class="card-info">'+(p.sizes?'<span class="card-tag">'+p.sizes+'</span>':'')+(p.colors?'<span class="card-tag">'+p.colors+'</span>':'')+(p.minOrder?'<span class="card-tag">حداقل '+p.minOrder+'</span>':'')+'</div>'+
      '<div class="card-price">'+fmtP(p.price)+'</div>'+st+'</div></div>';
  }).join('');
  window._VISIBLE=items;
}

function openModal(i){
  var p=window._VISIBLE[i];
  var nm=p.title||p.typeLabel||p.code;
  var isSleep=(p.tab==='p4');
  var mainLink=isSleep?TEL_SLEEPWEAR:TEL_UNDERWEAR;
  var mainLabel=isSleep?'📢 کانال لباس خواب (ثبت سفارش)':'📢 کانال لباس زیر (ثبت سفارش)';
  var html='<button class="modal-close" onclick="closeModal()">✕</button><div style="clear:both"></div>'+
    '<div class="modal-name">'+nm+'</div>'+
    (p.brand?'<div class="modal-brand">'+p.brand+'</div>':'')+
    '<div class="modal-price">'+fmtP(p.price)+'</div>'+
    (p.code?'<div class="modal-row"><span>کد محصول</span><span>'+p.code+'</span></div>':'')+
    (p.sizes?'<div class="modal-row"><span>سایزبندی</span><span>'+p.sizes+'</span></div>':'')+
    (p.colors?'<div class="modal-row"><span>رنگبندی</span><span>'+p.colors+'</span></div>':'')+
    (p.minOrder?'<div class="modal-row"><span>حداقل سفارش</span><span>'+p.minOrder+' عدد</span></div>':'')+
    (p.material?'<div class="modal-row"><span>جنس</span><span>'+p.material+'</span></div>':'')+
    (p.desc1?'<div class="modal-row"><span>توضیحات</span><span>'+p.desc1+'</span></div>':'')+
    '<div class="modal-actions">'+
      '<a class="act-main" href="'+mainLink+'" target="_blank">'+mainLabel+'</a>'+
      '<a href="'+SUPPORT_TG+'" target="_blank">👤 پشتیبانی تلگرام</a>'+
      '<a href="'+BALE_LINK+'" target="_blank">🔵 کانال بله</a>'+
      '<a href="'+INSTAGRAM_LINK+'" target="_blank">📸 اینستاگرام</a>'+
      '<a href="tel:'+PHONE_NUM+'">☎️ '+PHONE_NUM+'</a>'+
    '</div>';
  document.getElementById('MODAL_BODY').innerHTML=html;
  document.getElementById('MODAL_OV').classList.add('open');
}
function closeModal(){document.getElementById('MODAL_OV').classList.remove('open');}

function loadProducts(){
  db.collection('products').get().then(function(snap){
    PRODUCTS=[];
    snap.forEach(function(doc){PRODUCTS.push(doc.data());});
    renderChips();
    renderGrid();
  }).catch(function(err){
    document.getElementById('GRID').innerHTML='<div class="nores">خطا در دریافت محصولات: '+(err&&err.message?err.message:err)+'</div>';
  });
}
loadProducts();
</script>
</body>
</html>
