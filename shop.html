<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rosa Vie | رُزاوی</title>
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&family=Bodoni+Moda:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:#faf6f1;color:#3a2e29;min-height:100vh}
.hdr{background:linear-gradient(135deg,#c4607a,#d4789a,#e8a0b0);padding:12px 14px 20px;text-align:center;position:relative}
.hdr h1{font-family:'Bodoni Moda',serif;font-size:1.85rem;font-weight:800;letter-spacing:5px;color:#fff}
.hdr p{font-size:0.72rem;color:rgba(255,255,255,0.85);letter-spacing:4px;margin-top:3px}
/* نوار بالا: منو/هوم چپ، سبد/حساب راست */
.topnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.topnav-side{display:flex;gap:8px}
.topnav-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.12);color:#fff;font-size:1.05rem;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.topnav-btn img.nav-ico{width:30px;height:30px;object-fit:contain}
.support-panel-list a img.nav-ico{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.topnav-cart-badge{position:absolute;top:-5px;left:-5px;background:#fff;color:#c67b9c;font-size:0.6rem;font-weight:900;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
/* منوی کشویی همبرگری */
.side-drawer-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:4000}
.side-drawer-ov.open{display:block}
.side-drawer{position:fixed;top:0;right:-260px;width:250px;height:100%;background:#ffffff;z-index:4001;transition:right 0.25s;padding:16px;overflow-y:auto}
.side-drawer.open{right:0}
.side-drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.side-drawer-head span{font-size:1rem;font-weight:900;color:#2e2320}
.side-drawer-x{width:30px;height:30px;border-radius:50%;background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29;font-size:0.9rem;cursor:pointer}
.side-drawer-item{display:flex;align-items:center;gap:10px;padding:13px 10px;border-radius:10px;color:#3a2e29;font-size:0.85rem;font-weight:700;cursor:pointer;text-decoration:none}
.side-drawer-item:active{background:#f7efe6}
/* بنر متحرک ۴:۳ */
.banner-wrap{max-width:960px;margin:14px auto 0;padding:0 14px}
.banner-viewport{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#ffffff}
.banner-track{display:flex;height:100%;transition:transform 0.45s ease}
.banner-slide{flex:0 0 100%;height:100%;cursor:pointer;display:block}
.banner-slide img{width:100%;height:100%;display:block;object-fit:cover}
.banner-arrow{position:absolute;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.35);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;direction:ltr}
.banner-arrow.prev{left:14px}
.banner-arrow.next{right:14px}
.banner-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
.banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.45)}
.banner-dots span.on{background:#fff;width:16px;border-radius:3px;transition:width 0.25s}
/* صفحه‌ی اطلاعات تمام‌صفحه (درباره ما/تماس با ما/مجله/حساب کاربری) */
.info-page{display:none;position:fixed;inset:0;background:#faf6f1;z-index:4200;overflow-y:auto}
.info-page.open{display:block}
.info-page-head{position:sticky;top:0;background:#ffffff;border-bottom:1px solid #ecdfd2;padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.info-page-body{padding:22px 18px;max-width:640px;margin:0 auto}
.info-page-body p{color:#5a4d45;font-size:1.2rem;line-height:2.1;white-space:pre-line;text-align:right}
/* حساب کاربری */
.acc-tabs{display:flex;gap:8px;margin-bottom:18px;background:#f3e9de;border-radius:11px;padding:4px}
.acc-tab{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:0.82rem;font-weight:700;color:#8a7a6c;cursor:pointer}
.acc-tab.on{background:#fff;color:#2e2320;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.acc-btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;background:#d4789a;color:#fff;font-weight:900;font-size:0.86rem;border:none;cursor:pointer;margin-top:6px}
.acc-err{color:#c0304a;font-size:0.78rem;margin:6px 0;min-height:1em}
.acc-profile{text-align:center;padding:10px 0}
.acc-avatar{width:74px;height:74px;border-radius:50%;background:#f7efe6;display:flex;align-items:center;justify-content:center;font-size:2.1rem;margin:0 auto 14px}
.acc-name{font-size:1.05rem;font-weight:900;color:#2e2320}
.acc-phone{font-size:0.82rem;color:#8a7a6c;margin-top:4px;direction:ltr}
.acc-logout{margin-top:22px;background:#f7efe6;color:#c0304a;border:1px solid #ecdfd2;border-radius:10px;padding:11px;width:100%;font-weight:700;font-size:0.82rem;cursor:pointer}
.acc-terms-row{display:flex;align-items:flex-start;gap:7px;margin:10px 0 14px;font-size:0.76rem;color:#5a4d45}
.acc-terms-row input{margin-top:3px;flex-shrink:0}
/* مجله */
.mag-card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #ecdfd2;border-radius:13px;padding:13px 14px;margin-bottom:11px;cursor:pointer}
.mag-card-icon{font-size:1.8rem;flex-shrink:0}
.mag-card-title{font-size:0.86rem;font-weight:900;color:#2e2320}
.mag-card-sum{font-size:0.74rem;color:#8a7a6c;margin-top:4px;line-height:1.7}
.mag-article p{color:#3a2e29;font-size:0.88rem;line-height:2.1;margin-bottom:16px;text-align:right}
.mag-h2{font-size:0.95rem;font-weight:900;color:#b0517a;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid #f3e0e8}
.mag-toc{background:#f7efe6;border-radius:12px;padding:14px 16px;margin-bottom:18px}
.mag-toc-title{font-weight:900;font-size:0.82rem;color:#2e2320;margin-bottom:8px}
.mag-toc a{display:block;font-size:0.8rem;color:#8a7a6c;padding:4px 0;text-decoration:none}
.mag-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mag-type-card{background:#fff;border:1px solid #ecdfd2;border-radius:12px;padding:12px}
.mag-type-card b{display:block;font-size:0.82rem;color:#2e2320;margin-bottom:5px}
.mag-type-card span{font-size:0.74rem;color:#8a7a6c;line-height:1.8}
.mag-steps{list-style:none;padding:0;margin-bottom:16px}
.mag-steps li{display:flex;gap:12px;margin-bottom:14px}
.mag-step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#d4789a;color:#fff;font-weight:900;font-size:0.8rem;display:flex;align-items:center;justify-content:center}
.mag-step-text{font-size:0.83rem;color:#3a2e29;line-height:1.9;padding-top:3px}
.mag-tbl{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:0.76rem}
.mag-tbl th,.mag-tbl td{border:1px solid #ecdfd2;padding:8px 6px;text-align:center;color:#3a2e29}
.mag-tbl th{background:#f7efe6;font-weight:900;color:#2e2320}
.mag-proscons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mag-pros,.mag-cons{border-radius:12px;padding:12px}
.mag-pros{background:#e3f5ea}
.mag-cons{background:#fce8e8}
.mag-pros b,.mag-cons b{display:block;font-size:0.78rem;margin-bottom:6px}
.mag-pros b{color:#1f8a4c}
.mag-cons b{color:#d64545}
.mag-pros ul,.mag-cons ul{padding-right:16px;margin:0;font-size:0.72rem;color:#3a2e29;line-height:1.9}
.mag-faq{background:#fff;border:1px solid #ecdfd2;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mag-faq b{display:block;font-size:0.8rem;color:#2e2320;margin-bottom:5px}
.mag-faq span{font-size:0.76rem;color:#5a4d45;line-height:1.9}
@media(max-width:380px){.mag-type-grid,.mag-proscons{grid-template-columns:1fr}}
.searchbar{max-width:960px;margin:16px auto 0;padding:0 14px}
.searchbar input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ecdfd2;background:#ffffff;color:#3a2e29;font-family:inherit;font-size:0.86rem}
.searchbar input::placeholder{color:#b5a493}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;max-width:960px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid #e0d0c0;background:#ffffff;color:#6b5d55;font-size:0.74rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{border-color:#d4789a;background:#fbe8ee;color:#b0517a}
.rescount{max-width:960px;margin:10px auto 0;padding:0 16px;font-size:0.72rem;color:#a89686}
.grid{max-width:960px;margin:10px auto 30px;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#f7efe6;border-radius:12px;overflow:hidden;border:1px solid #ecdfd2;cursor:pointer;position:relative}
.card-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f3e9de}
.card-img-ph{width:100%;aspect-ratio:1;background:#f3e9de;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.cat-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#3a2e29;font-size:0.6rem;padding:3px 8px;border-radius:8px}
.card-body{padding:10px 11px 12px}
.card-name{font-size:0.78rem;font-weight:700;color:#2e2320;line-height:1.4}
.card-brand{font-size:0.66rem;color:#9c8a7c;margin-top:2px}
.card-code{font-size:0.66rem;color:#a89686;margin-top:2px}
.card-info{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card-tag{font-size:0.62rem;background:#f3e9de;color:#6b5d55;padding:2px 7px;border-radius:6px}
.card-price{font-size:0.88rem;color:#c25a80;font-weight:900;margin-top:8px}
.badge-in,.badge-call,.badge-out{display:inline-block;margin-top:6px;font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:6px}
.badge-in{background:#e3f5ea;color:#1f8a4c}
.badge-call{background:#fbf0dc;color:#b5790a}
.badge-out{background:#fce8e8;color:#d64545}
.nores{text-align:center;padding:60px 20px;color:#9c8a7c;font-size:0.85rem;grid-column:1/-1}
.loading{text-align:center;padding:60px 20px;color:#a89686;font-size:0.85rem;grid-column:1/-1}
/* مودال جزئیات */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:3000;align-items:flex-end;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:#ffffff;border-radius:18px 18px 0 0;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:20px 18px}
@media(min-width:640px){.modal-ov{align-items:center}.modal{border-radius:16px}}
.modal-close{width:32px;height:32px;border-radius:50%;background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29;font-size:1rem;float:left;cursor:pointer}
.modal-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;margin-top:8px;background:#f3e9de}
.modal-name{font-size:1.05rem;font-weight:900;color:#2e2320;margin-top:6px}
.modal-brand{font-size:0.75rem;color:#9c8a7c;margin-top:2px}
.modal-price{font-size:1.2rem;color:#c25a80;font-weight:900;margin-top:12px}
.modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ecdfd2;font-size:0.78rem}
.modal-row span:first-child{color:#9c8a7c}
.modal-row span:last-child{color:#3a2e29;font-weight:700}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.modal-actions a{text-align:center;padding:11px 6px;border-radius:10px;text-decoration:none;font-size:0.74rem;font-weight:700;background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29}
.modal-actions a.act-main{background:#2a9d5c;border-color:#2a9d5c;color:#fff;grid-column:1/-1}
.footer-note{max-width:960px;margin:0 auto 30px;padding:0 16px;text-align:center;color:#9c8a7c;font-size:0.7rem;line-height:1.9}
/* سبد خرید */
.qty-box{display:flex;align-items:center;gap:14px;justify-content:center;margin:16px 0}
.qty-btn{width:38px;height:38px;border-radius:10px;background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29;font-size:1.2rem;cursor:pointer}
.qty-val{font-size:1.05rem;font-weight:900;min-width:28px;text-align:center}
.addcart-btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;background:#d4789a;color:#fff;font-weight:900;font-size:0.86rem;border:none;cursor:pointer;margin-top:6px}
.fab-cart{position:fixed;bottom:18px;left:18px;width:54px;height:54px;border-radius:50%;background:#d4789a;color:#fff;font-size:1.3rem;border:none;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:2500;cursor:pointer;display:none;align-items:center;justify-content:center}
.fab-cart.show{display:flex}
.fab-cart-badge{position:absolute;top:-4px;right:-4px;background:#fff;color:#c67b9c;font-size:0.66rem;font-weight:900;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cart-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #ecdfd2}
.cart-item img,.cart-item-ph{width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f3e9de;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:0.78rem;font-weight:700;color:#3a2e29}
.cart-item-price{font-size:0.74rem;color:#d4789a;margin-top:3px;font-weight:700}
.cart-qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.cart-qty button{width:24px;height:24px;border-radius:6px;background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29;cursor:pointer;font-size:0.85rem}
.cart-qty span{font-size:0.78rem;font-weight:700;min-width:16px;text-align:center}
.cart-remove{color:#e57373;font-size:0.68rem;cursor:pointer;text-decoration:underline;margin-right:8px}
.cart-empty{text-align:center;color:#c9b8a8;padding:50px 20px;font-size:2.4rem}
.cart-total-row{display:flex;justify-content:space-between;font-size:0.92rem;font-weight:900;color:#2e2320;margin:14px 0}
.cart-total-row span:last-child{color:#d4789a}
.checkout-btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;background:#2a9d5c;color:#fff;font-weight:900;font-size:0.86rem;border:none;cursor:pointer;margin-top:8px}
.form-field{margin-bottom:12px}
.form-field label{display:block;font-size:0.74rem;color:#9c8a7c;margin-bottom:5px}
.form-field input,.form-field textarea,.form-field select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #e0d0c0;background:#ffffff;color:#3a2e29;font-family:inherit;font-size:0.82rem}
.form-field textarea{resize:vertical;min-height:56px}
.acc-section-title{font-size:0.9rem;font-weight:900;color:#2e2320;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid #ecdfd2}
.order-hist-item{background:#f7efe6;border-radius:11px;padding:12px 14px;margin-bottom:9px;font-size:0.78rem}
.order-hist-row{display:flex;justify-content:space-between;font-weight:700;color:#2e2320}
.order-hist-sub{color:#9c8a7c;font-size:0.7rem;margin-top:4px}
.order-hist-empty{text-align:center;color:#a89686;font-size:0.8rem;padding:20px 0}
.phone-verified{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #ecdfd2;background:#f7efe6;color:#8a7a6c;font-size:0.82rem;direction:ltr;text-align:left}
.order-ok{text-align:center;padding:20px 6px}
.order-ok .oi{font-size:2.6rem;margin-bottom:10px}
.order-ok .onum{font-size:1.1rem;font-weight:900;color:#d4789a;margin:8px 0;direction:ltr}
/* صفحه لیست محصولات (کلیک روی بنر کد/برند) */
.list-view{display:none;position:fixed;inset:0;background:#faf6f1;z-index:4000;overflow-y:auto}
.list-view.open{display:block}
.list-view-head{position:sticky;top:0;background:#ffffff;border-bottom:1px solid #ecdfd2;padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.list-view-back{background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29;border-radius:9px;padding:8px 12px;font-size:0.78rem;cursor:pointer;flex-shrink:0}
.list-view-title{font-size:0.86rem;font-weight:900;color:#2e2320}
/* دکمه شناور پشتیبانی/کانال‌ها بالا راست */
.fab-support{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(20,20,20,0.85);backdrop-filter:blur(4px);color:#fff;font-size:1.15rem;border:1.5px solid rgba(255,255,255,0.25);box-shadow:0 4px 14px rgba(0,0,0,0.4);z-index:2500;cursor:pointer;display:flex;align-items:center;justify-content:center}
.support-panel-list a{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:10px;background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29;text-decoration:none;font-size:0.82rem;font-weight:700;margin-bottom:8px}
/* بنر */
/* پیشنهاد ویژه (VIP) */
.vip-title{max-width:960px;margin:6px auto 0;padding:0 16px;font-size:0.85rem;font-weight:900;color:#3a2e29;display:flex;align-items:center;gap:6px}
.vip-title span{color:#d4789a}
.vip-scroll{display:flex;gap:10px;overflow-x:auto;max-width:960px;margin:0 auto;padding:8px 14px 16px;scrollbar-width:none}
.vip-scroll::-webkit-scrollbar{display:none}
.vip-card{flex-shrink:0;width:150px;background:#f7efe6;border:1.5px solid #ecdfd2;border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.vip-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.vip-card-ph{width:100%;aspect-ratio:1;background:#f3e9de;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.vip-card-body{padding:9px 10px 11px}
.vip-card-name{font-size:0.72rem;font-weight:700;color:#2e2320;line-height:1.4}
.vip-price-old{font-size:0.66rem;color:#a89686;text-decoration:line-through;margin-top:6px}
.vip-price-new{font-size:0.86rem;color:#e0447a;font-weight:900;margin-top:2px}
.vip-discount-badge{position:absolute;top:7px;left:7px;background:#e0304f;color:#fff;font-size:0.6rem;font-weight:900;padding:2px 7px;border-radius:7px;z-index:2}
</style>
</head>
<body>
<div class="hdr">
  <h1>ROSA VIE</h1><p>under wear</p>
  <div class="topnav">

  <a class="side-drawer-item" href="javascript:void(0)" onclick="openInfoPanel('درباره ما','به رُزاوی خوش آمدید.\n\nدر این مسیر، تلاش می‌کنیم ترکیبی از طراحی دقیق، انتخاب پارچه‌های باکیفیت و تنوع سایز را در اختیار شما قرار دهیم؛ تا مشتریان شما، با هر سایز، فرم بدن و سلیقه‌ای، بتوانند چیزی پیدا کنند که واقعاً مناسب خودشان باشد.\n\nهدف ما ارائه‌ی محصولاتی با متریال عالی، دوخت دقیق و طراحی‌های به‌روز است؛ کالایی که مشتریان شما هر روز با لذت آن را بپوشند.\n\nما به این باور داریم که زیبایی محدود به یک سایز، یک فرم یا یک رنگ نیست؛ از این رو، همواره در مسیر تنوع بیشتر حرکت می‌کنیم.\n\nاز انتخاب رنگ و مدل تا دریافت و پس دادن کالا، سرویس‌دهی بی‌نقصی را فراهم کرده‌ایم؛ تجربه‌ای ساده، سریع و مطمئن.\n\nبابت وقتی که گذاشتید، سپاسگزاریم. امیدواریم همکاری با ما، هر روز شما را پرفروش‌تر و موفق‌تر کند. اگر سؤالی دارید یا به راهنمایی نیاز دارید، با ما تماس بگیرید؛ خوشحال می‌شویم کمکتان کنیم.\n\nبا احترام،\nتیم رُزاوی')">ℹ️ درباره ما</a>

function fmtP(v){
  var n=parseInt(String(v).replace(/[^\d]/g,''),10);
  if(!n)return v||'--';
  return n.toLocaleString('en-US')+' تومان';
}

function renderChips(){
  var el=document.getElementById('CHIPS');
  el.innerHTML=CATS.map(function(c){
    return '<button class="chip'+(CUR_CAT===c.v?' on':'')+'" onclick="setCat(\''+c.v+'\')">'+c.l+'</button>';
  }).join('');
}
function setCat(v){CUR_CAT=v;renderChips();renderGrid();}

function productCardHTML(p,clickExpr){
  var st=p.stock==='in'?'<span class="badge-in">موجود</span>':p.stock==='call'?'<span class="badge-call">تماس بگیرید</span>':'<span class="badge-out">ناموجود</span>';
  var nm=p.title||p.typeLabel||p.code;
  var imgHTML=p.img?'<img class="card-img" src="'+p.img+'" loading="lazy">':'<div class="card-img-ph">👗</div>';
  return '<div class="card" onclick="'+clickExpr+'">'+imgHTML+'<span class="cat-badge">'+(p.tabLabel||'')+'</span>'+
    '<div class="card-body"><div class="card-name">'+nm+'</div>'+
    (p.brand?'<div class="card-brand">'+p.brand+'</div>':'')+
    (p.code?'<div class="card-code">کد: '+p.code+'</div>':'')+
    '<div class="card-info">'+(p.sizes?'<span class="card-tag">'+p.sizes+'</span>':'')+(p.colors?'<span class="card-tag">'+p.colors+'</span>':'')+(p.minOrder?'<span class="card-tag">حداقل '+p.minOrder+'</span>':'')+'</div>'+
    '<div class="card-price">'+fmtP(p.price)+'</div>'+st+'</div></div>';
}
function renderGrid(){
  var q=(document.getElementById('SQ').value||'').trim().toLowerCase();
  var items=PRODUCTS.filter(function(p){
    var mc=CUR_CAT==='all'||p.tab===CUR_CAT;
    var mq=!q||[p.code,p.title,p.sizes,p.colors,p.brand].some(function(v){return (v||'').toLowerCase().indexOf(q)>-1;});
    return mc&&mq;
  });
  document.getElementById('RC').textContent=items.length+' محصول';
  var grid=document.getElementById('GRID');
  if(!items.length){grid.innerHTML='<div class="nores">محصولی یافت نشد</div>';return;}
  grid.innerHTML=items.map(function(p,i){
    return productCardHTML(p,'openModal('+i+')');
  }).join('');
  window._VISIBLE=items;
}

function hideAllModals(){
  document.getElementById('MODAL_OV').classList.remove('open');
  document.getElementById('SUPPORT_OV').classList.remove('open');
  var co=document.getElementById('CART_OV');if(co)co.classList.remove('open');
  var lv=document.getElementById('LIST_VIEW');if(lv)lv.classList.remove('open');
  var dr=document.getElementById('SIDE_DRAWER');if(dr)dr.classList.remove('open');
  var drov=document.getElementById('DRAWER_OV');if(drov)drov.classList.remove('open');

  var ao=document.getElementById('ACCOUNT_OV');if(ao)ao.classList.remove('open');
  var mo=document.getElementById('MAG_OV');if(mo)mo.classList.remove('open');

function closeTopModal(){
  if(RV_MODAL_DEPTH>0){history.back();}

  if(RV_MODAL_DEPTH>0)RV_MODAL_DEPTH--;

function saveProfileDetails(){
  var user=fbAuth&&fbAuth.currentUser;
  if(!user)return;
  var name=(document.getElementById('PF_NAME').value||'').trim();
  var province=document.getElementById('PF_PROVINCE').value||'';
  var city=document.getElementById('PF_CITY').value||'';
  var address=(document.getElementById('PF_ADDR').value||'').trim();
  var postal=(document.getElementById('PF_POSTAL').value||'').trim();
  var err=document.getElementById('PF_ERR');
  if(!name){err.textContent='لطفاً نام رو وارد کن';return;}
  err.textContent='';
  db.collection('customers').doc(user.uid).set({name:name,province:province,city:city,address:address,postal:postal},{merge:true}).then(function(){
    CUR_CUSTOMER=CUR_CUSTOMER||{};
    CUR_CUSTOMER.name=name;CUR_CUSTOMER.province=province;CUR_CUSTOMER.city=city;CUR_CUSTOMER.address=address;CUR_CUSTOMER.postal=postal;
    err.style.color='#2a9d5c';err.textContent='✅ اطلاعات ذخیره شد';
  }).catch(function(e){
    err.style.color='#c0304a';err.textContent='خطا در ذخیره: '+(e&&e.message?e.message:e);
  });
}
function loadOrderHistory(uid){
  var list=document.getElementById('ORDHIST_LIST');
  var countEl=document.getElementById('ORDHIST_COUNT');
  if(!list)return;
  db.collection('orders').where('customerUid','==',uid).get().then(function(snap){
    var orders=[];
    snap.forEach(function(doc){orders.push(doc.data());});
    orders.sort(function(a,b){
      var ta=(a.createdAt&&a.createdAt.toMillis)?a.createdAt.toMillis():0;
      var tb=(b.createdAt&&b.createdAt.toMillis)?b.createdAt.toMillis():0;
      return tb-ta;
    });
    if(countEl)countEl.textContent=orders.length;
    if(!orders.length){list.innerHTML='<div class="order-hist-empty">هنوز هیچ سفارشی ندارید</div>';return;}
    var stLbl={'new':'در حال بررسی','done':'انجام‌شده'};
    list.innerHTML=orders.map(function(o){
      var itemsTxt=(o.items||[]).map(function(it){return it.title+' ×'+it.qty;}).join('، ');
      return '<div class="order-hist-item"><div class="order-hist-row"><span>'+o.orderNo+'</span><span>'+fmtP(o.total)+'</span></div>'+
        '<div class="order-hist-sub">'+itemsTxt+'</div>'+
        '<div class="order-hist-sub">وضعیت: '+(stLbl[o.status]||o.status||'—')+'</div></div>';
    }).join('');
  }).catch(function(err){
    list.innerHTML='<div class="order-hist-empty">خطا در دریافت سفارش‌ها</div>';
  });
}
var TERMS_TEXT='۱. پذیرش شرایط\nبا ورود به وب‌سایت فروشگاه رُزاوی و استفاده از خدمات آن، شما موافقت خود را با تمامی شرایط و قوانین مندرج در این صفحه اعلام می‌دارید. در صورت عدم پذیرش، لطفاً از خدمات فروشگاه استفاده نکنید.\n\n۲. ثبت سفارش\nمشتریان موظف‌اند اطلاعات دقیق و صحیح را هنگام ثبت سفارش وارد کنند. ثبت سفارش به منزله‌ی عقد قرارداد قطعی نیست و فروشگاه در صورت بروز مشکل، حق لغو سفارش را برای خود محفوظ می‌داند.\n\n۳. قیمت‌ها و شرایط پرداخت\nقیمت کالاها به‌صورت روزانه به‌روزرسانی می‌شود و ممکن است بدون اطلاع قبلی تغییر کند.\nفروشگاه رُزاوی در حال حاضر درگاه پرداخت اینترنتی ندارد و پرداخت فقط از طریق کارت‌به‌کارت انجام می‌شود. پس از ثبت سفارش، شماره کارت از طریق تلگرام یا بله در اختیارتان قرار می‌گیرد؛ لطفاً پس از واریز، تصویر رسید پرداخت را ارسال کنید تا سفارش نهایی و پردازش شود.\n\n۴. ارسال و تحویل\nفروشگاه ما سفارش‌ها را از طریق روش زیر ارسال می‌کند:\n۱. ارسال با تیپاکس: مناسب برای شهرهای بزرگ و مراکز استان‌ها. زمان تحویل معمولاً ۱ تا ۲ روز کاری است.\n۲. ارسال با اسنپ (حتماً از تلگرام پیگیری شود): مناسب برای داخل شهر. فروشگاه مسئولیتی در قبال تأخیر ناشی از عوامل خارج از کنترل (مانند شرایط جوی یا ترافیک) ندارد.\n\n۵. بازگشت کالا\nبه دلیل رعایت اصول بهداشتی و سلامت مشتریان محترم، امکان مرجوع یا تعویض لباس زیر زنانه (از جمله سوتین، شورت، بادی و ست‌های لباس زیر) پس از ارسال وجود ندارد.\nبا این حال، در شرایط زیر مرجوعی پذیرفته می‌شود:\n۱. اگر محصول ارسالی با سفارش ثبت‌شده مغایرت داشته باشد (مثلاً رنگ یا سایز اشتباه ارسال شده باشد)\n۲. اگر کالا در زمان تحویل دارای نقص فیزیکی یا ایراد ظاهری باشد\nدر صورت مغایرت، مشتری باید حداکثر تا ۲۴ ساعت پس از تحویل، از طریق پشتیبانی تلگرام موضوع را اعلام و تصویر محصول را ارسال کند.\n\n۶. حفظ حریم خصوصی\nاطلاعات شخصی مشتریان نزد فروشگاه محفوظ است و بدون رضایت آن‌ها در اختیار شخص ثالث قرار نمی‌گیرد.\n\n۷. مالکیت معنوی\nتمامی محتوا، تصاویر، لوگو و طراحی‌های موجود در وب‌سایت متعلق به فروشگاه رُزاوی بوده و هرگونه استفاده غیرمجاز پیگرد قانونی دارد.\n\n۸. تغییرات در قوانین\nفروشگاه حق دارد در هر زمان این قوانین را تغییر دهد. نسخه‌ی به‌روزرسانی‌شده در همین صفحه منتشر خواهد شد و ادامه‌ی استفاده از خدمات به منزله‌ی پذیرش تغییرات است.';

var MAGAZINE_ARTICLES=[
  {icon:'🪄',title:'راهنمای کامل سوتین چسبی: از انتخاب تا نگهداری',summary:'همه‌چیز درباره‌ی انواع سوتین چسبی، طرز استفاده درست و نکات نگهداری.',richHtml:'\n<p>سوتین چسبی (که با اسم‌های سیلیکونی، ژله‌ای یا نامرئی هم شناخته می‌شه) یکی از پرکاربردترین لوازم جانبی برای لباس‌های بدون بند، یقه‌باز یا پشت‌باز شده. برخلاف سوتین‌های معمولی، بدون بند دور شونه یا کمر، فقط با چسبندگی خودش سر جاش می‌مونه.</p>\n\n<div class="mag-toc">\n  <div class="mag-toc-title">فهرست مطالب</div>\n  <a href="javascript:void(0)" onclick="document.getElementById(&#39;mag-sec-types&#39;).scrollIntoView({behavior:&#39;smooth&#39;})">۱. انتخاب مدل مناسب</a>\n  <a href="javascript:void(0)" onclick="document.getElementById(&#39;mag-sec-usage&#39;).scrollIntoView({behavior:&#39;smooth&#39;})">۲. طرز استفاده گام‌به‌گام</a>\n  <a href="javascript:void(0)" onclick="document.getElementById(&#39;mag-sec-size&#39;).scrollIntoView({behavior:&#39;smooth&#39;})">۳. تناسب با سایز سینه</a>\n  <a href="javascript:void(0)" onclick="document.getElementById(&#39;mag-sec-care&#39;).scrollIntoView({behavior:&#39;smooth&#39;})">۴. نگهداری و شست‌وشو</a>\n  <a href="javascript:void(0)" onclick="document.getElementById(&#39;mag-sec-proscons&#39;).scrollIntoView({behavior:&#39;smooth&#39;})">۵. مزایا و معایب</a>\n  <a href="javascript:void(0)" onclick="document.getElementById(&#39;mag-sec-faq&#39;).scrollIntoView({behavior:&#39;smooth&#39;})">۶. سؤالات متداول</a>\n</div>\n\n<div class="mag-h2" id="mag-sec-types">۱. انتخاب مدل مناسب</div>\n<p>چهار نوع اصلی سوتین چسبی توی بازار هست که هرکدوم برای یه نیاز خاص طراحی شده:</p>\n<div class="mag-type-grid">\n  <div class="mag-type-card"><b>مدل سیلیکونی (حجم‌دهی)</b><span>برای افزایش حجم و لباس‌های دکلته و کلوش؛ ضخیم‌تر و ماندگارتره.</span></div>\n  <div class="mag-type-card"><b>مدل ژله‌ای (Jelly Cup)</b><span>خیلی سبک و نازک؛ برای لباس‌های شب مجلسی و لباس‌های تابستانی مناسبه.</span></div>\n  <div class="mag-type-card"><b>مدل پارچه‌ای</b><span>پوشش طبیعی‌تر، بند و لیفت میانی داره؛ برای استفاده روزمره بهتره.</span></div>\n  <div class="mag-type-card"><b>مدل پروانه‌ای (لیفت عالی)</b><span>لیفت‌دهی قوی برای لباس‌های مجلسی و شب؛ بهترین کاربرد برای سینه‌های نازک.</span></div>\n</div>\n\n<div class="mag-h2" id="mag-sec-usage">۲. طرز استفاده گام‌به‌گام</div>\n<ol class="mag-steps">\n  <li><span class="mag-step-num">۱</span><span class="mag-step-text"><b>تمیز کردن پوست:</b> پوست باید کاملاً خشک و فاقد هرگونه لوسیون، روغن یا کرم‌پودر باشه — این مهم‌ترین قدمه، وگرنه چسبندگی از بین می‌ره.</span></li>\n  <li><span class="mag-step-num">۲</span><span class="mag-step-text"><b>جدا کردن لایه محافظ:</b> لایه‌ی محافظ روی چسب کاپ‌ها رو به‌آرامی جدا کنید.</span></li>\n  <li><span class="mag-step-num">۳</span><span class="mag-step-text"><b>چسباندن کاپ از پایین:</b> کاپ‌ها رو از پایین سینه شروع کنید و به‌سمت بالا بچسبونید تا حباب هوا زیرش نمونه؛ با کف دست چند ثانیه فشار بدید.</span></li>\n  <li><span class="mag-step-num">۴</span><span class="mag-step-text"><b>بستن گیره میانی:</b> در آخر گیره‌ی وسط رو ببندید تا فاصله و لیفت دلخواه تنظیم بشه.</span></li>\n</ol>\n\n<div class="mag-h2" id="mag-sec-size">۳. تناسب با سایز سینه</div>\n<table class="mag-tbl">\n<tr><th>سایز کاپ</th><th>مدل پیشنهادی</th></tr>\n<tr><td>الف، ب</td><td>ایده‌آل برای همه‌ی مدل‌ها، به‌خصوص پروانه‌ای</td></tr>\n<tr><td>پ</td><td>مدل سیلیکونی یا پارچه‌ای پیشنهاد می‌شه</td></tr>\n<tr><td>ث/د و بزرگ‌تر</td><td>حمایت کافی ندارد — سوتین معمولی بهتره</td></tr>\n</table>\n\n<div class="mag-h2" id="mag-sec-care">۴. نگهداری و شست‌وشو</div>\n<p>برای اینکه چسبندگی سوتین چسبی چند بار قابل استفاده بمونه، بعد از هر بار استفاده با آب ولرم و صابون ملایم بشورید و بذارید کاملاً خشک بشه. هرگز از حوله برای خشک کردن یا از شوینده‌های قوی استفاده نکنید — این کار چسبندگی کاپ رو از بین می‌بره.</p>\n<p>اگه در پوست حساس دارید، توصیه می‌شه مراسم طولانی در پیش دارید، مدل‌های پارچه‌ای بهترین گزینه هستن چون به دلیل قابلیت تنفس، پوست کمتر تحریک می‌شه.</p>\n\n<div class="mag-h2" id="mag-sec-proscons">۵. مزایا و معایب</div>\n<div class="mag-proscons">\n  <div class="mag-pros"><b>مزایا</b><ul><li>مناسب لباس‌های بدون بند و پشت‌باز</li><li>بدون اثر بند روی شونه</li><li>سبک و کم‌حجم</li></ul></div>\n  <div class="mag-cons"><b>معایب</b><ul><li>حمایت کمتر نسبت به سوتین معمولی</li><li>عمر مصرف محدود (چند بار استفاده)</li><li>نیاز به پوست کاملاً تمیز و خشک</li></ul></div>\n</div>\n\n<div class="mag-h2" id="mag-sec-faq">۶. سؤالات متداول</div>\n<div class="mag-faq"><b>چند بار می‌شه از یه سوتین چسبی استفاده کرد؟</b><span>بسته به کیفیت و نحوه‌ی نگهداری، معمولاً بین ۱۰ تا ۳۰ بار قابل استفاده مجدده.</span></div>\n<div class="mag-faq"><b>آیا برای پوست حساس مناسبه؟</b><span>بله، به‌خصوص مدل‌های پارچه‌ای؛ ولی بهتره اول روی بخش کوچیکی از پوست تست بشه.</span></div>\n<div class="mag-faq"><b>چطور چسبندگیش رو بیشتر کنیم؟</b><span>قبل از استفاده، پوست رو با الکل ساده (بدون چربی) پاک کنید و اجازه بدید کاملاً خشک بشه.</span></div>\n'},
  {icon:'📏',title:'راهنمای سایزبندی لباس زیر زنانه',summary:'چطور سایز درست سوتین رو تشخیص بدیم تا مشتری‌هاتون کمتر برگشتی بزنن.',content:'یکی از رایج‌ترین دلایل مرجوعی لباس زیر، اشتباه بودن سایزه. طبق برآوردهای بین‌المللی، بیشتر از ۷۰ درصد خانم‌ها سایز واقعی سوتین خودشون رو نمی‌دونن. دونستن چند نکته‌ی ساده می‌تونه کمک زیادی به کاهش برگشتی‌های مغازه‌ی شما بکنه.\n\nسایز سوتین از دو بخش تشکیل شده: عدد بند (Band Size) و حرف کاپ (Cup Size). عدد بند از دور قفسه‌ی سینه، درست زیر سینه‌ها اندازه‌گیری می‌شه. حرف کاپ هم از تفاضل دور سینه (از پرترین نقطه) و دور بند به‌دست میاد؛ هرچقدر این تفاضل بیشتر باشه، حرف کاپ بزرگ‌تره.\n\nنکته‌ی مهمی که خیلی‌ها نمی‌دونن: سایز بدن با گذر زمان (به‌خصوص بعد از بارداری، تغییر وزن یا سن) عوض می‌شه، پس توصیه می‌شه هر ۱ تا ۲ سال سایزشون رو دوباره چک کنن.\n\nبه‌عنوان یه فروشنده، اگه بتونید این نکته‌ها رو ساده به مشتری‌هاتون توضیح بدید (یا حتی یه برگه‌ی راهنمای سایز کنار محصولاتتون بذارید)، هم رضایت مشتری بالا می‌ره، هم برگشتی کالا به‌خاطر سایز اشتباه به‌شدت کم می‌شه.'},
  {icon:'🧺',title:'نکات نگهداری و شست‌وشوی لباس زیر',summary:'چند نکته‌ی ساده که عمر لباس زیر رو چند برابر می‌کنه — نکاتی که ارزش داره به مشتری‌هاتون هم بگید.',content:'لباس زیر و لباس خواب معمولاً از پارچه‌های ظریف‌تر و کش‌دارتری نسبت به لباس‌های روزمره ساخته می‌شن، برای همین نگهداری درست‌شون خیلی توی عمر و فرم موندنشون تأثیر داره.\n\nبهترین روش، شست‌وشوی دستی با آب سرد یا ولرمه، نه ماشین لباسشویی. اگه امکان شست‌وشوی دستی نیست، حتماً از کیسه‌ی مخصوص لباس زیر داخل ماشین استفاده بشه تا قلاب سوتین به تور و توری‌های ظریف گیر نکنه.\n\nاستفاده از خشک‌کن (Dryer) یکی از بزرگ‌ترین دشمن‌های کش و اسفنج سوتینه؛ حرارت بالا باعث می‌شه کش‌ها زودتر از موعد شل بشن. بهترین کار، خشک کردن به‌صورت افقی روی سطح صاف یا آویزون‌کردن دور از نور مستقیم آفتابه.\n\nیه نکته‌ی طلایی دیگه: خوبه هر لباس زیر حداقل یک روز در میون استراحت کنه تا اسفنج و کش‌هاش فرصت برگشت به حالت اولیه رو داشته باشن. این یعنی داشتن حداقل ۲ تا ۳ دست سوتین در چرخش، به مراتب بهتر از استفاده‌ی مداوم از یک دسته.'},
  {icon:'🍂',title:'ترندهای فصل: امسال چه چیزی پرفروش‌تره',summary:'مروری بر رنگ‌ها، طرح‌ها و متریال‌هایی که این فصل بیشتر مورد توجه مشتری‌هاست.',content:'بازار لباس زیر و لباس خواب، مثل هر بخش دیگه‌ای از مد، فصلی و متغیره. این روزها تقاضا برای ست‌های هارمونیک (سوتین و شورت هم‌رنگ و هم‌طرح) نسبت به قطعات تک، افزایش قابل‌توجهی داشته.\n\nاز نظر رنگ‌بندی، رنگ‌های خاکی و نودی (بژ، کرم، قهوه‌ای روشن) همچنان پرفروش‌ترین گزینه برای استفاده‌ی روزمره هستن؛ چون زیر هر نوع لباسی خودشون رو نشون نمی‌دن. در کنارش، رنگ‌های پررنگ مثل زرشکی و سبز زمردی برای خرید هدیه و مناسبت‌های خاص طرفدار زیادی پیدا کرده‌ن.\n\nاز نظر متریال هم، پارچه‌های مدال (Modal) و پنبه‌ی ارگانیک به‌خاطر حس راحتی بیشتر نسبت به توری سنتی، محبوبیت بیشتری بین خانم‌هایی که لباس زیر رو برای استفاده‌ی روزانه (نه فقط مناسبتی) می‌خرن پیدا کرده‌ن.\n\nبرای فروشنده‌های عزیز: پیشنهاد می‌کنیم توی چیدمان مغازه یا صفحه‌تون، این تنوع (هم پارچه‌ی راحت روزمره، هم طرح‌های خاص‌تر) رو کنار هم داشته باشید تا هم مشتری‌های عملگرا رو راضی کنید، هم اونایی که دنبال چیز خاص‌تری هستن.'},
  {icon:'📦',title:'راهنمای خرید عمده: چطور تنوع مغازه رو هوشمندانه انتخاب کنیم',summary:'چند اصل ساده برای اینکه سرمایه‌تون رو روی محصولات درست خرج کنید، نه روی موجودی راکد.',content:'یکی از چالش‌های همیشگی مغازه‌داران و فروشنده‌های آنلاین، تصمیم‌گیری درباره‌ی اینه که چقدر تنوع بخرن و چقدر عمق (تعداد در هر مدل). خرید بیش از حد متنوع، سرمایه رو پخش می‌کنه و ریسک موجودی راکد بالا می‌بره؛ خرید خیلی محدود هم باعث از دست دادن مشتری‌هایی می‌شه که دنبال گزینه‌های متنوع‌تری هستن.\n\nیه قانون کلی خوب، رعایت نسبت تقریبی ۷۰ به ۳۰ است: حدود ۷۰ درصد سرمایه رو روی مدل‌های پرفروش و کلاسیک (رنگ‌های خنثی، سایزهای پرتقاضا) بذارید، و ۳۰ درصد باقی‌مونده رو روی مدل‌های جدید یا خاص‌تر امتحان کنید تا ریسک کمتری داشته باشید.\n\nنکته‌ی مهم دیگه توجه به توزیع سایزه؛ خیلی از فروشنده‌ها روی سایزهای میانی زیاد سرمایه‌گذاری می‌کنن و سایزهای خیلی کوچیک یا خیلی بزرگ رو کم می‌خرن، درحالی‌که این سایزها معمولاً مشتری‌های وفادارتری دارن چون گزینه‌ی کمتری توی بازار براشون پیدا می‌شه.\n\nدر نهایت، خرید فصلی و به‌روز رو فراموش نکنید — موندن روی موجودی قدیمی، هم سرمایه رو قفل می‌کنه، هم مغازه رو از چشم مشتری‌های همیشگی می‌ندازه. ما توی رُزاوی سعی می‌کنیم دائم محصولات به‌روز و جدید اضافه کنیم تا همیشه گزینه‌ی تازه برای انتخاب داشته باشید.'}
];
var MAG_VIEW='list';
function openMagazine(){
  MAG_VIEW='list';
  renderMagazineList();
  document.getElementById('MAG_OV').classList.add('open');
  pushModalState();
}
function closeMagazine(){closeTopModal();}
function magazineBack(){
  if(MAG_VIEW==='article'){MAG_VIEW='list';renderMagazineList();}
  else closeMagazine();
}
function renderMagazineList(){
  document.getElementById('MAG_TITLE').textContent='مجله رُزاوی';
  var body=document.getElementById('MAG_BODY');
  body.innerHTML=MAGAZINE_ARTICLES.map(function(a,i){
    return '<div class="mag-card" onclick="openArticle('+i+')"><div class="mag-card-icon">'+a.icon+'</div><div><div class="mag-card-title">'+a.title+'</div><div class="mag-card-sum">'+a.summary+'</div></div></div>';
  }).join('');
}
function openArticle(i){
  MAG_VIEW='article';
  var a=MAGAZINE_ARTICLES[i];
  document.getElementById('MAG_TITLE').textContent=a.title;
  if(a.richHtml){
    document.getElementById('MAG_BODY').innerHTML='<div class="mag-article">'+a.richHtml+'</div>';
  }else{
    var paras=a.content.split('\n\n').map(function(p){return '<p>'+p+'</p>';}).join('');
    document.getElementById('MAG_BODY').innerHTML='<div class="mag-article">'+paras+'</div>';
  }
  document.getElementById('MAG_BODY').scrollTop=0;
}

        ('<div style="text-align:center;font-size:0.72rem;color:#2a9d5c;margin-top:8px">✔ قوانین و مقررات را پذیرفته‌اید'+(termsAt?' ('+termsAt+')':'')+' — <span onclick="openTermsPage()" style="text-decoration:underline;cursor:pointer;color:#8a7a6c">مشاهده</span></div>')

        '</div>'+
        '<button class="acc-logout" onclick="doLogout()">خروج از حساب</button>'+

        '<div class="form-field"><label>شهر</label><select id="PF_CITY"></select></div>'+
        '<div class="form-field"><label>آدرس پستی</label><textarea id="PF_ADDR" placeholder="نام خیابان، کوچه و پلاک">'+addr+'</textarea></div>'+
        '<div class="form-field"><label>کدپستی</label><input id="PF_POSTAL" type="text" value="'+postal+'" style="direction:ltr;text-align:left"></div>'+
        '<div class="form-field"><label>شماره موبایل <span style="color:#2a9d5c">✔ تأیید شده</span></label><div class="phone-verified">'+ph+'</div></div>'+
        '<div class="acc-err" id="PF_ERR"></div>'+

      :
        ('<div class="form-field"><label>نام و نام‌خانوادگی</label><input id="AC_NAME" type="text" placeholder="مثال: زهرا محمدی"></div>'+

         '<div class="acc-terms-row"><input type="checkbox" id="AC_TERMS"><label for="AC_TERMS">'+
           '<span onclick="event.preventDefault();openTermsPage()" style="text-decoration:underline;color:#b0517a">قوانین و مقررات</span> را خوانده‌ام و می‌پذیرم</label></div>'+

         '<button class="acc-btn" id="AC_BTN" onclick="doSignup()">ثبت‌نام</button>')

}

function authErrMsg(code){
  var m={
    'auth/email-already-in-use':'این شماره قبلاً ثبت‌نام کرده — به‌جاش وارد شو.',
    'auth/invalid-email':'شماره تماس معتبر نیست.',
    'auth/weak-password':'رمز عبور باید حداقل ۶ رقم باشه.',
    'auth/user-not-found':'حسابی با این شماره پیدا نشد.',
    'auth/wrong-password':'رمز عبور اشتباهه.',
    'auth/invalid-credential':'شماره یا رمز عبور اشتباهه.',
    'auth/network-request-failed':'مشکل در اتصال به اینترنت.',
    'auth/unauthorized-domain':'این آدرس سایت هنوز توی فایربیس مجاز نشده (Authorized domains رو چک کن).',
    'auth/operation-not-allowed':'روش ورود با رمز عبور توی فایربیس فعال نیست.',
    'auth/too-many-requests':'تعداد تلاش زیاد بوده، چند دقیقه صبر کن.'
  };
  return m[code]||('خطای ناشناخته'+(code?(' ('+code+')'):'')+' — این کد رو برای بررسی بیشتر بفرست.');
}

function doSignup(){
  var name=(document.getElementById('AC_NAME').value||'').trim();
  var phone=(document.getElementById('AC_PHONE').value||'').trim();
  var pass=document.getElementById('AC_PASS').value||'';
  var pass2=document.getElementById('AC_PASS2').value||'';
  var err=document.getElementById('AC_ERR');
  if(!name){err.textContent='لطفاً نام رو وارد کن';return;}
  if(!phone||phone.replace(/\D/g,'').length<10){err.textContent='لطفاً یه شماره تماس درست وارد کن';return;}
  if(pass.length<6){err.textContent='رمز عبور باید حداقل ۶ رقم باشه';return;}
  if(pass!==pass2){err.textContent='تکرار رمز عبور با رمز عبور یکی نیست';return;}
  var termsChecked=document.getElementById('AC_TERMS').checked;
  if(!termsChecked){err.textContent='برای ثبت‌نام باید قوانین و مقررات رو بپذیری';return;}
  err.textContent='';
  var btn=document.getElementById('AC_BTN');btn.disabled=true;btn.textContent='در حال ثبت‌نام...';
  fbAuth.createUserWithEmailAndPassword(phoneToEmail(phone),pass).then(function(cred){
    var uid=cred.user.uid;
    return db.collection('customers').doc(uid).set({name:name,phone:phone,termsAccepted:true,termsAcceptedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
      CUR_CUSTOMER={uid:uid,name:name,phone:phone,termsAccepted:true};
      showSavePasswordReminder(pass);
    });
  }).catch(function(e){
    btn.disabled=false;btn.textContent='ثبت‌نام';
    err.textContent=authErrMsg(e.code);
  });
}
function doLogin(){
  var phone=(document.getElementById('AC_PHONE').value||'').trim();
  var pass=document.getElementById('AC_PASS').value||'';
  var err=document.getElementById('AC_ERR');
  if(!phone||!pass){err.textContent='شماره و رمز عبور رو وارد کن';return;}
  err.textContent='';
  var btn=document.getElementById('AC_BTN');btn.disabled=true;btn.textContent='در حال ورود...';
  fbAuth.signInWithEmailAndPassword(phoneToEmail(phone),pass).then(function(cred){
    return loadCustomerProfile(cred.user.uid).then(function(){renderAccountView();});
  }).catch(function(e){
    btn.disabled=false;btn.textContent='ورود';
    err.textContent=authErrMsg(e.code);
  });
}
function forgotPassword(){
  var body=document.getElementById('ACCOUNT_BODY');
  body.innerHTML='<p>به دلیل مشکلات فنی، نمی‌تونیم رمز عبور رو بازنویسی کنیم — مجبوریم حساب قبلی‌تون رو پاک کنیم تا بتونید با رمز جدید دوباره ثبت‌نام کنید.</p>'+
    '<p>شماره تماستون رو برای پشتیبانی بفرستید تا این کار رو براتون انجام بدیم.</p>'+
    '<button class="acc-btn" onclick="silentCloseAccount();openSupport()">📞 تماس با پشتیبانی</button>'+
    '<div style="text-align:center;margin-top:12px"><span style="color:#8a7a6c;font-size:0.78rem;cursor:pointer;text-decoration:underline" onclick="renderAccountView()">بازگشت به ورود</span></div>';
}
function doLogout(){
  fbAuth.signOut().then(function(){CUR_CUSTOMER=null;ACC_MODE='login';renderAccountView();});
}
function loadCustomerProfile(uid){
  return db.collection('customers').doc(uid).get().then(function(doc){
    if(doc.exists){
      var d=doc.data();
      var acceptedAt=(d.termsAcceptedAt&&d.termsAcceptedAt.toDate)?d.termsAcceptedAt.toDate():null;
      CUR_CUSTOMER={uid:uid,name:d.name||'',phone:d.phone||'',province:d.province||'',city:d.city||'',address:d.address||'',postal:d.postal||'',termsAccepted:!!d.termsAccepted,termsAcceptedAt:acceptedAt};
    }
  }).catch(function(){});
}
function watchAuthState(){
  try{
    if(!initAuth())return;
    fbAuth.onAuthStateChanged(function(user){
      if(user)loadCustomerProfile(user.uid);
      else CUR_CUSTOMER=null;
    });
  }catch(e){console.error('watchAuthState error',e);}
}
// ── نمایش/پنهانی دکمه سبد بسته به اسکرول ──
var SCROLL_THRESH=180;
window.addEventListener('scroll',function(){updateFab();});
function addToCart(){
  var p=window._CURP,qty=window._CURQTY||1;
  if(!p)return;
  var colorEl=document.getElementById('MCOLOR');
  var colorNote=colorEl?colorEl.value.trim():'';
  var key=p.id+'::'+colorNote;
  var existing=CART.find(function(c){return c.key===key;});
  if(existing)existing.qty+=qty;
  else CART.push({key:key,id:p.id,code:p.code,title:p.title||p.typeLabel||p.code,price:p.price,img:p.img||null,tab:p.tab,tabLabel:p.tabLabel,qty:qty,colorNote:colorNote});
  saveCart();updateFab();closeModal();
  showToast((p.title||p.code)+' به سبد اضافه شد ✅');
}
function showToast(msg){
  var old=document.querySelector('.rv-toast');if(old)old.remove();
  var t=document.createElement('div');t.className='rv-toast';t.textContent=msg;
  t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:#fff;padding:11px 20px;border-radius:22px;font-size:0.8rem;font-weight:700;z-index:5000;box-shadow:0 4px 18px rgba(0,0,0,0.5)';
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2200);
}
function cartTotal(){return CART.reduce(function(s,c){var n=parseInt(String(c.price).replace(/[^\d]/g,''),10)||0;return s+n*c.qty;},0);}
function renderCart(){
  var body=document.getElementById('CART_BODY');
  if(!CART.length){
    body.innerHTML='<button class="modal-close" onclick="closeCart()">✕</button><div style="clear:both"></div><div class="cart-empty">🛒</div><div style="text-align:center;color:#888;font-size:0.82rem">سبد خریدت خالیه</div>';
    return;
  }
  var itemsHTML=CART.map(function(c,i){
    var img=c.img?'<img src="'+c.img+'">':'<div class="cart-item-ph">👗</div>';
    return '<div class="cart-item">'+img+'<div class="cart-item-info"><div class="cart-item-name">'+c.title+'</div>'+
      '<div class="cart-item-price">'+fmtP(c.price)+'</div>'+
      (c.colorNote?'<div style="font-size:0.68rem;color:#e8a0b8;margin-top:2px">🎨 '+c.colorNote+'</div>':'')+
      '<div class="cart-qty"><button onclick="cartQty('+i+',-1)">−</button><span>'+c.qty+'</span><button onclick="cartQty('+i+',1)">+</button>'+
      '<span class="cart-remove" onclick="cartRemove('+i+')">حذف</span></div></div></div>';
  }).join('');
  body.innerHTML='<button class="modal-close" onclick="closeCart()">✕</button><div style="clear:both"></div>'+
    '<div class="modal-name" style="margin-bottom:10px">سبد خرید</div>'+
    itemsHTML+
    '<div class="cart-total-row"><span>جمع کل</span><span>'+fmtP(cartTotal())+'</span></div>'+
    '<button class="checkout-btn" onclick="renderCheckout()">تکمیل سفارش</button>';
}
function cartQty(i,d){CART[i].qty=Math.max(1,CART[i].qty+d);saveCart();updateFab();renderCart();}
function cartRemove(i){CART.splice(i,1);saveCart();updateFab();renderCart();}
function openCart(){renderCart();document.getElementById('CART_OV').classList.add('open');pushModalState();}
function closeCart(){closeTopModal();}

function renderCheckout(){
  var body=document.getElementById('CART_BODY');
  var pfName=(CUR_CUSTOMER&&CUR_CUSTOMER.name)||'';
  var pfPhone=(CUR_CUSTOMER&&CUR_CUSTOMER.phone)||'';
  body.innerHTML='<button class="modal-close" onclick="closeCart()">✕</button><div style="clear:both"></div>'+
    '<div class="modal-name" style="margin-bottom:12px">تکمیل سفارش</div>'+
    '<div class="cart-total-row"><span>جمع کل ('+CART.reduce(function(s,c){return s+c.qty;},0)+' قلم)</span><span>'+fmtP(cartTotal())+'</span></div>'+
    '<div class="form-field"><label>نام و نام‌خانوادگی *</label><input id="OF_NAME" type="text" placeholder="مثال: زهرا محمدی" value="'+pfName+'"></div>'+
    '<div class="form-field"><label>شماره تماس *</label><input id="OF_PHONE" type="tel" placeholder="09xxxxxxxxx" style="direction:ltr;text-align:left" value="'+pfPhone+'"></div>'+
    '<div class="form-field"><label>توضیحات سفارش (اختیاری)</label><textarea id="OF_NOTE" placeholder="آدرس، رنگ/سایز مدنظر، هر نکته‌ی دیگه..."></textarea></div>'+
    '<div id="OF_ERR" style="color:#e57373;font-size:0.76rem;margin-bottom:8px"></div>'+
    '<button class="checkout-btn" id="OF_SUBMIT" onclick="submitOrder()">✅ ثبت نهایی سفارش</button>'+
    '<div style="text-align:center;color:#777;font-size:0.68rem;margin-top:10px">بعد از ثبت، از طریق شماره تماس باهات هماهنگ می‌کنیم.</div>';
}
function copyOrderNo(no){
  var done=function(){
    var btn=document.getElementById('COPY_BTN');
    if(btn){btn.textContent='✅ کپی شد';setTimeout(function(){btn.textContent='📋 کپی شماره سفارش';},1800);}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(no).then(done).catch(function(){fallbackCopy(no,done);});
  }else{
    fallbackCopy(no,done);
  }
}
function fallbackCopy(text,cb){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if(cb)cb();
  }catch(e){}
}
function genOrderNo(){
  var d=new Date();
  var ymd=d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  var rnd=Math.random().toString(36).slice(2,6).toUpperCase();
  return 'RV'+ymd+'-'+Date.now().toString(36).slice(-4).toUpperCase()+rnd;
}
function submitOrder(){
  var name=(document.getElementById('OF_NAME').value||'').trim();
  var phone=(document.getElementById('OF_PHONE').value||'').trim();
  var note=(document.getElementById('OF_NOTE').value||'').trim();
  var errEl=document.getElementById('OF_ERR');
  if(!name){errEl.textContent='لطفاً نام رو وارد کن';return;}
  if(!phone||phone.replace(/\D/g,'').length<10){errEl.textContent='لطفاً یه شماره تماس درست وارد کن';return;}
  errEl.textContent='';
  var btn=document.getElementById('OF_SUBMIT');
  btn.disabled=true;btn.textContent='در حال ثبت سفارش...';
  var orderNo=genOrderNo();
  var order={
    orderNo:orderNo,
    items:CART.map(function(c){return {code:c.code,title:c.title,qty:c.qty,price:c.price,tab:c.tab,color:c.colorNote||''};}),
    total:cartTotal(),
    customerName:name,
    customerPhone:phone,
    customerUid:(CUR_CUSTOMER&&CUR_CUSTOMER.uid)||null,
    note:note,
    status:'new',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection('orders').doc(orderNo).set(order).then(function(){
    CART=[];saveCart();updateFab();
    document.getElementById('CART_BODY').innerHTML='<button class="modal-close" onclick="closeCart()">✕</button><div style="clear:both"></div>'+
      '<div class="order-ok"><div class="oi">🎉</div><div style="font-weight:900;font-size:0.95rem">سفارشت با موفقیت ثبت شد!</div>'+
      '<div class="onum" id="ORDNO_TXT">'+orderNo+'</div>'+
      '<button class="checkout-btn" style="background:#f7efe6;border:1px solid #e0d0c0;color:#3a2e29" onclick="copyOrderNo(\''+orderNo+'\')" id="COPY_BTN">📋 کپی شماره سفارش</button>'+
      '<div style="color:#999;font-size:0.78rem;margin-top:10px">این شماره رو نگه‌دار. به‌زودی از طریق شماره تماست باهات هماهنگ می‌کنیم.</div></div>';
  }).catch(function(err){
    btn.disabled=false;btn.textContent='✅ ثبت نهایی سفارش';
    errEl.textContent='خطا در ثبت سفارش: '+(err&&err.message?err.message:err);
  });
}

var BANNER_ITEMS=[];
var BANNER_IDX=0;
var BANNER_TIMER=null;
function renderBanners(banners){
  var track=document.getElementById('BANNER_TRACK');
  var dots=document.getElementById('BANNER_DOTS');
  BANNER_ITEMS=(banners||[]).filter(function(b){return b&&b.img;});
  if(!BANNER_ITEMS.length){
    document.querySelector('.banner-wrap').style.display='none';
    return;
  }
  track.innerHTML=BANNER_ITEMS.map(function(b,i){
    return '<a class="banner-slide" href="javascript:void(0)" onclick="bannerClick('+JSON.stringify(b.link).replace(/"/g,'&quot;')+')"><img src="'+b.img+'"></a>';
  }).join('');
  dots.innerHTML=BANNER_ITEMS.map(function(_,i){return '<span'+(i===0?' class="on"':'')+'></span>';}).join('');
  BANNER_IDX=0;
  updateBannerPos();
  if(BANNER_ITEMS.length>1)startBannerAuto();
}
function updateBannerPos(){
  var track=document.getElementById('BANNER_TRACK');
  track.style.transform='translateX('+(BANNER_IDX*100)+'%)';
  document.querySelectorAll('#BANNER_DOTS span').forEach(function(d,i){d.classList.toggle('on',i===BANNER_IDX);});
}
function bannerNav(dir){
  if(!BANNER_ITEMS.length)return;
  BANNER_IDX=(BANNER_IDX+dir+BANNER_ITEMS.length)%BANNER_ITEMS.length;
  updateBannerPos();
  startBannerAuto();
}
function startBannerAuto(){
  clearInterval(BANNER_TIMER);
  BANNER_TIMER=setInterval(function(){bannerNav(1);},4200);
}

function bannerClick(link){
  if(!link)return;
  if(link.type==='code'&&link.value){
    var matches=PRODUCTS.filter(function(p){return p.code===link.value;});
    if(matches.length===1)openModalForProduct(matches[0]);
    else if(matches.length>1)openProductListView('کد: '+link.value,matches);
    return;
  }
  if(link.type==='brand'&&link.value){
    var bMatches=PRODUCTS.filter(function(p){return p.brand===link.value&&(!link.tab||p.tab===link.tab);});
    openProductListView('برند: '+link.value,bMatches);
    return;
  }
}
function renderVip(vip){
  var sec=document.getElementById('VIP_SECTION');
  var valid=(vip||[]).filter(function(v){return v&&v.code;});
  if(!valid.length){sec.innerHTML='';return;}
  var cardsHTML=valid.map(function(v){
    var img=v.img?'<img src="'+v.img+'">':'<div class="vip-card-ph">👗</div>';
    var hasDisc=v.discountPrice&&v.discountPrice!==v.price;
    var priceHTML=hasDisc?
      '<div class="vip-price-old">'+fmtP(v.price)+'</div><div class="vip-price-new">'+fmtP(v.discountPrice)+'</div>':
      '<div class="vip-price-new">'+fmtP(v.price)+'</div>';
    var badge=hasDisc?'<span class="vip-discount-badge">تخفیف ویژه</span>':'';
    var safeCode=(v.code||'').replace(/'/g,"\\'");
    return '<div class="vip-card" onclick="openByCode(\''+safeCode+'\')">'+badge+img+'<div class="vip-card-body"><div class="vip-card-name">'+(v.title||v.code)+'</div>'+priceHTML+'</div></div>';
  }).join('');
  sec.innerHTML='<div class="vip-title"><span>⭐</span> پیشنهاد ویژه</div><div class="vip-scroll">'+cardsHTML+'</div>';
}
function openByCode(code){
  var idx=PRODUCTS.findIndex(function(p){return p.code===code;});
  if(idx<0)return;
  CUR_CAT='all';
  document.getElementById('SQ').value='';
  renderChips();renderGrid();
  var vi=window._VISIBLE.findIndex(function(p){return p.code===code;});
  if(vi>=0)openModal(vi);
}
function loadSiteData(){
  db.collection('siteData').doc('homepage').get().then(function(doc){
    if(!doc.exists)return;
    var d=doc.data();
    renderBanners(d.banners);
    renderVip(d.vip);
  }).catch(function(err){console.error('loadSiteData error',err);});
}

function loadProducts(){
  db.collection('products').get().then(function(snap){
    PRODUCTS=[];
    snap.forEach(function(doc){PRODUCTS.push(doc.data());});
    renderChips();
    renderGrid();
  }).catch(function(err){
    document.getElementById('GRID').innerHTML='<div class="nores">خطا در دریافت محصولات: '+(err&&err.message?err.message:err)+'</div>';
  });
}
loadCart();
loadProducts();
loadSiteData();
watchAuthState();
</script>
